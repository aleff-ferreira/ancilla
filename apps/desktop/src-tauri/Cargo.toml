[package]
name = "ancilla"
version = "0.18.0"
description = "Ancilla: desktop ADE for the Muse Code CLI"
edition = "2021"
license = "MIT"
repository = "https://github.com/aleff-ferreira/ancilla"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# A webview does not reliably have the browser's Notification API, so the OS notifier comes from here.
tauri-plugin-notification = "2"
# Links in replies open in the default browser; the webview itself has nowhere to put them.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
