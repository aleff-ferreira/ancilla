name: Release

# Draft first. Each build job puts what it makes into a private draft release, and nothing reaches the address that
# installed copies read (releases/latest/download/latest.json) until the publish job has checked the whole draft:
# its assets, latest.json, and every signature against the installers' bytes (docs/RELEASING.md). A tag is made once:
# one that already has a published release is never built again.
on:
  push:
    tags: ["v*"]
  # Builds a tag by hand, as `gh workflow run release.yml --repo aleff-ferreira/ancilla --ref vX.Y.Z`, or rehearses the
  # whole pipeline from any branch with dry_run. It runs the workflow file as it is at that ref, so a tag made before
  # this file went draft-first still runs the old workflow.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse: build and check everything into a throwaway prerelease draft, publish nothing, then delete the draft"
        type: boolean
        default: false
      rotate_key:
        description: "Allow a new updater public key in this release; signatures are still checked against the old key"
        type: boolean
        default: false

# Every job merges its platform into the release's latest.json, so two runs for one tag would clobber each other.
# A second run waits for the first rather than cancelling it half-published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The tag the release is made under. A rehearsal never uses a real tag: dry-run-<run id> names a draft that is
  # deleted at the end and could not be mistaken for a version.
  RELEASE_TAG: ${{ inputs.dry_run && format('dry-run-{0}', github.run_id) || github.ref_name }}
  # A rehearsal's draft is a prerelease, so that even a mistake that published it could never make it the latest release.
  RELEASE_PRERELEASE: ${{ inputs.dry_run && 'true' || 'false' }}
  # The GitHub release page. tauri-action also copies it into latest.json as the update's notes.
  RELEASE_BODY: |
    Ancilla ${{ github.ref_name }} — Deep research. Agents in view.

    An open-source desktop and web workspace for Muse Code by AMAZONIA WORKS, available on Windows, macOS and Linux.

    **Deep Research:** investigate questions with parallel workers, follow their searches and sources, and save cited reports as PDF, Word or HTML. **Crew:** follow ordinary prompts and tools alongside workflows, native agents and background tasks, with timelines, live status and controls for work that needs you.

    **New in 0.20.3**
    - Linux **.deb and .rpm installers** add Ancilla to your application menu and install its system dependencies. Node.js remains private to the app.
    - **Install Muse Code inside Ancilla**, follow any browser approval, sign in with your Meta subscription, then choose a project folder. Setup includes progress, cancellation and retry.
    - **Fix for the Linux UnsafePath thread-start error:** Ancilla safely prepares the selected account's Muse data-folder permissions before starting work, preserving login, history and deletion records.
    - **Fresh subscription limits from Meta:** supported Muse browser logins refresh five-hour and weekly quota without a model call. Account selection stays fixed; missing or expired readings show as unknown.
    - Optional **desktop shortcuts**, plus one-click AppImage installation to a permanent location with an application-menu icon.
    - Muse is detected after installation even when the desktop PATH omits it. Package installations use package updates; AppImages retain signed automatic updates.

    Read [what changed in this release](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/CHANGELOG.md) or [explore the interface](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md).

    **What you need.** Ancilla bundles Node.js. On Linux, choose **Install Muse Code** in the app if needed. On Windows and macOS, setup provides Meta's installation command. Then choose **Sign in with Meta** and approve access using the account that owns your Muse Code plan. An existing Muse login is reused. Windows supports native Muse or Muse inside WSL2.

    **Which file.** Windows: `x64-setup.exe`. macOS, Apple Silicon and Intel: `universal.dmg`. Linux x86_64: **amd64.deb** for Ubuntu/Debian/Mint or **x86_64.rpm** for Fedora and compatible distributions; open it with your software installer, then launch Ancilla from the application menu. For a portable copy, use **amd64.AppImage**, allow executing it in your file manager, and open it; setup can install its launcher. If FUSE is unavailable, run it with `--appimage-extract-and-run`. Desktop shortcuts are available in **Settings → Linux setup**; some desktops require right-clicking the shortcut and choosing **Allow Launching**.

    **Updates.** Windows, macOS and AppImage builds accept only updates signed with Ancilla's key. For `.deb` and `.rpm`, download and open the next package; Settings links to the latest release.

    **Unsigned installers.** The Windows installer is not Authenticode-signed yet, so SmartScreen may warn about an unrecognised app: choose More info, then Run anyway. The macOS app is not notarized by Apple yet, so its first launch needs a right-click on the app, then Open.

    **Licenses.** Ancilla is free software under the [GNU AGPL v3](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/LICENSE). Portions derive from Helicon, Copyright (c) 2026 Harjot Singh Rana and contributors, under the MIT License; its notice is kept in [LICENSE-HELICON](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/LICENSE-HELICON). The third-party software each build bundles, Node.js among it, is listed with its licenses in [THIRD_PARTY_NOTICES.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/THIRD_PARTY_NOTICES.md), which also ships inside the app.

jobs:
  desktop-windows:
    permissions:
      contents: write
    # The image windows-latest resolved to when 0.20.3 was released (run 36533903301, 2026-09-29), pinned so that a runner
    # migration cannot change the toolchain under the signing step. Moving to a newer image is a change made on purpose,
    # in a rehearsal (dry_run) first.
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
      started_at: ${{ steps.started.outputs.at }}
    steps:
      # First, so a missing key fails in seconds instead of after a full build that could not be signed.
      - name: Check the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error title=TAURI_SIGNING_PRIVATE_KEY is not set::Add the updater's private key as the repository secret TAURI_SIGNING_PRIVATE_KEY (docs/RELEASING.md, one-time setup), then run this again. Without it nothing can be signed, and installed copies refuse an unsigned update."
            exit 1
          fi
      # Early, because the publish job refuses any asset uploaded before this moment: that is how a leftover of an
      # earlier attempt would show.
      - name: Note when this run started
        id: started
        shell: bash
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      # The tag names the release, and the files decide the version the updater compares, so they must agree.
      # Only here: the other jobs wait for this one. A rehearsal may start from a branch, where the files only have
      # to agree with each other.
      - name: Check the tag matches the version
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node scripts/bump-version.mjs --check "$GITHUB_REF_NAME"
          elif [ "$DRY_RUN" = "true" ]; then
            node scripts/bump-version.mjs --check
          else
            echo "::error title=Not a tag::Run this workflow on a vX.Y.Z tag (gh workflow run release.yml --ref vX.Y.Z), or with dry_run to rehearse, not on $GITHUB_REF_NAME."
            exit 1
          fi
      # tauri-action finds a release by its tag, published or not, and writes into it. So a tag that already has a
      # published release stops here, and a draft an earlier attempt left is deleted: its assets and its latest.json
      # entries would be merged into this release.
      - name: Refuse a published tag and delete stale drafts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-draft.mjs prepare --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      # The key installed copies trust is the one the newest published release had (docs/RELEASING.md). The Linux job
      # and the publish job read it again, and fail when it cannot be read: this finds that out now, in seconds, and
      # not after the Windows and macOS builds, for a repository that has no published release yet or a tag that cannot
      # be fetched. It also makes the comparison with that release which the publish job makes, so that a config whose
      # key, update endpoints, identifier or version is wrong fails here and not after the builds. A replaced key needs
      # a manual run with rotate_key; a pushed tag never gets it.
      - name: Check there is a trusted updater key to verify against
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROTATE_KEY: ${{ inputs.rotate_key }}
        run: |
          rotate=()
          if [ "$ROTATE_KEY" = "true" ]; then
            rotate=(--allow-key-rotation)
          fi
          node scripts/check-release-draft.mjs trusted-conf --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/trusted-tauri.conf.json" --conf apps/desktop/src-tauri/tauri.conf.json "${rotate[@]}"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - run: npm ci
      # The first check only sees that the key is there. This one signs a scratch file the way the build signs the
      # installer, so a damaged key, or one that needs a password the secrets do not give, fails here within a
      # minute rather than after the whole Windows build. Only here, like the tag check: the other jobs wait for it.
      # The same check runs on its own, without a release, from .github/workflows/check-signing-key.yml.
      - name: Check the updater signing key opens
        shell: bash
        # A backstop: nothing here should wait for input, but a prompt on a runner would wait for hours.
        timeout-minutes: 5
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/check-signing-key.mjs
      - run: npm run build --workspace @ancilla/daemon --workspace @ancilla/ui --workspace @ancilla/server
      # Pinned to a commit: this step holds the updater signing key, so a moved tag must not change what runs.
      - id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Which Node.js sidecar beforeBuildCommand bundles (apps/desktop/scripts/fetch-node.mjs).
          ANCILLA_NODE_TARGET: x86_64-pc-windows-msvc
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer for the in-app updater, which also publishes latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no password, so this secret is normally absent. The bundler then signs with an empty password
          # either way: it takes this variable when it is set, even to nothing, and when it is not, falls back to empty
          # because CI is set, as on every runner (tauri-cli's sign_updaters). Set the secret only for a key with one.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Ancilla ${{ env.RELEASE_TAG }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          # A draft: private until the publish job has checked it and says otherwise.
          releaseDraft: true
          # Never a prerelease for a real release, so the updater's releases/latest/download/latest.json points at it
          # once it is published. A rehearsal's draft is one.
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          # GitHub sometimes refuses a large asset upload ("Error saving asset"); retrying saves a manual job rerun.
          retryAttempts: 3
          args: --target x86_64-pc-windows-msvc

  desktop-macos:
    permissions:
      contents: write
    # After Windows, not beside it: both jobs merge their platform into the release's latest.json,
    # which is a read-modify-write that concurrent jobs could clobber, silently dropping a platform
    # from auto-update.
    needs: desktop-windows
    # The image macos-latest resolved to when 0.20.3 was released (Apple Silicon, run 36533903301).
    runs-on: macos-26
    timeout-minutes: 75
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - name: Check the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error title=TAURI_SIGNING_PRIVATE_KEY is not set::Add the updater's private key as the repository secret TAURI_SIGNING_PRIVATE_KEY (docs/RELEASING.md, one-time setup), then run this again. Without it nothing can be signed, and installed copies refuse an unsigned update."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          # universal-apple-darwin needs both halves installed; aarch64 is already the runner default.
          targets: x86_64-apple-darwin
      - run: npm ci
      - run: npm run build --workspace @ancilla/daemon --workspace @ancilla/ui --workspace @ancilla/server
      # Pinned to a commit: this step holds the updater signing key, so a moved tag must not change what runs.
      - id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Which Node.js sidecar beforeBuildCommand bundles (apps/desktop/scripts/fetch-node.mjs).
          ANCILLA_NODE_TARGET: universal-apple-darwin
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer for the in-app updater, which also publishes latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Empty unless the key has a password; see the Windows job.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Ancilla ${{ env.RELEASE_TAG }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          # A draft: private until the publish job has checked it and says otherwise.
          releaseDraft: true
          # Never a prerelease for a real release; see the Windows job.
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          # GitHub sometimes refuses a large asset upload ("Error saving asset"); retrying saves a manual job rerun.
          retryAttempts: 3
          # One universal binary for Apple Silicon and Intel; the macOS bundles come from tauri.macos.conf.json.
          args: --target universal-apple-darwin
      # A second draft for this tag, or a published release, would split the release in two: stop if this job's
      # upload did not go to the draft the Windows job made.
      - name: Check this job found the same draft
        shell: bash
        env:
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          EXPECTED_ID: ${{ needs.desktop-windows.outputs.release_id }}
        run: |
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" != "$EXPECTED_ID" ]; then
            echo "::error title=Two releases for one tag::This job uploaded to release '$RELEASE_ID', but the Windows job made '$EXPECTED_ID'."
            exit 1
          fi

  desktop-linux:
    permissions:
      contents: write
    needs: [desktop-windows, desktop-macos]
    # Not on 24.04 yet: the AppImage carries this image's glibc as its floor, so a newer image would stop it starting
    # on older distributions. GitHub is retiring the 22.04 image (unsupported from 2027-04-17), so this has to be
    # decided before then (docs/RELEASING.md, follow-ups). Unlike the other jobs it was pinned already.
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    outputs:
      appimage_sha256: ${{ steps.sign.outputs.sha256 }}
    steps:
      - name: Check the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error title=TAURI_SIGNING_PRIVATE_KEY is not set::Add the updater's private key as the repository secret TAURI_SIGNING_PRIVATE_KEY (docs/RELEASING.md, one-time setup), then run this again. Without it nothing can be signed, and installed copies refuse an unsigned update."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev squashfs-tools rpm libarchive-tools desktop-file-utils xvfb
      - run: npm ci
      - run: npm run build --workspace @ancilla/daemon --workspace @ancilla/ui --workspace @ancilla/server
      # Pinned to a commit: this step holds the updater signing key, so a moved tag must not change what runs.
      - id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Which Node.js sidecar beforeBuildCommand bundles (apps/desktop/scripts/fetch-node.mjs).
          ANCILLA_NODE_TARGET: x86_64-unknown-linux-gnu
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer for the in-app updater, which also publishes latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Empty unless the key has a password; see the Windows job.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Ancilla ${{ env.RELEASE_TAG }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          # A draft: private until the publish job has checked it and says otherwise.
          releaseDraft: true
          # Never a prerelease for a real release; see the Windows job.
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          # GitHub sometimes refuses a large asset upload ("Error saving asset"); retrying saves a manual job rerun.
          retryAttempts: 3
          args: --target x86_64-unknown-linux-gnu
      - name: Check this job found the same draft
        shell: bash
        env:
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          EXPECTED_ID: ${{ needs.desktop-windows.outputs.release_id }}
        run: |
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" != "$EXPECTED_ID" ]; then
            echo "::error title=Two releases for one tag::This job uploaded to release '$RELEASE_ID', but the Windows job made '$EXPECTED_ID'."
            exit 1
          fi
      - name: Check every Linux installer contains its runtime and application-menu icon
        run: bash apps/desktop/scripts/verify-linux-bundles.sh apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
      # The package a user installs with apt, started from /usr/bin/ancilla, as the installer smoke test does.
      - name: Install the Debian package and launch it from its system path
        run: |
          set -euo pipefail
          debs=("$GITHUB_WORKSPACE"/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb)
          sudo apt-get install -y "${debs[0]}"
          bash apps/desktop/scripts/smoke-linux.sh /usr/bin/ancilla
      # linuxdeploy bundles Ubuntu 22.04's libwayland-*. Newer host Mesa fails EGL init against the stale copy, so
      # WebKitGTK aborts with EGL_BAD_ALLOC before the window opens (tauri-apps/tauri#15665). The AppImage the bundler
      # just built is repacked without those libraries, here on the runner and not after a download of what is
      # already public, and it is signed again below.
      - name: Strip the bundled Wayland libraries from the AppImage
        id: repack
        shell: bash
        run: |
          set -euo pipefail
          images=("$GITHUB_WORKSPACE"/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage)
          [ "${#images[@]}" -eq 1 ]
          bash apps/desktop/scripts/repack-appimage.sh "${images[0]}" "$RUNNER_TEMP/appimage"
          echo "path=$RUNNER_TEMP/appimage/$(basename "${images[0]}")" >> "$GITHUB_OUTPUT"
      # What users get, not what the bundler made: the repack is the step that can break an AppImage.
      - name: Launch the repacked AppImage without requiring FUSE
        env:
          APPIMAGE: ${{ steps.repack.outputs.path }}
        run: bash apps/desktop/scripts/smoke-linux.sh "$APPIMAGE" --appimage-extract-and-run
      - name: Sign the repacked AppImage
        id: sign
        shell: bash
        env:
          APPIMAGE: ${{ steps.repack.outputs.path }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # `tauri signer sign` reads an unset password as "ask on the terminal", which CI does not have, and fails.
          # Set but empty is what opens a key made without a password.
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          rm -f "$APPIMAGE.sig"
          "$GITHUB_WORKSPACE/node_modules/.bin/tauri" signer sign "$APPIMAGE"
          test -s "$APPIMAGE.sig"
          echo "sha256=$(sha256sum "$APPIMAGE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # The check an installed copy makes, against the key it trusts: plugins.updater.pubkey as the newest published
      # release had it, not as it is in the tree being built. A release that replaces the key carries the new one but is
      # signed with the old one on purpose (docs/RELEASING.md), and only this reading accepts it. If that file cannot
      # be read, the job fails.
      - name: Verify the signature as installed copies will
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE: ${{ steps.repack.outputs.path }}
        run: |
          set -euo pipefail
          node scripts/check-release-draft.mjs trusted-conf --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/trusted-tauri.conf.json"
          node scripts/verify-updater-signature.mjs --conf "$RUNNER_TEMP/trusted-tauri.conf.json" "$APPIMAGE"
      # Into the private draft, by its id (a draft cannot be found by its tag), and latest.json last. Nothing here is
      # public: the publish job is what makes it so.
      - name: Replace the AppImage in the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE: ${{ steps.repack.outputs.path }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: node scripts/check-release-draft.mjs replace-appimage --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" --tag "$RELEASE_TAG" --appimage "$APPIMAGE"

  # The only job that can make a release public, and the only one that does so, and it holds no signing key: it
  # reads the draft, checks all of it against the installers' bytes, and only then publishes. A tag, never a rehearsal.
  # Approve it in the repository's "release" environment (docs/RELEASING.md).
  publish:
    if: github.ref_type == 'tag' && !inputs.dry_run
    needs: [desktop-windows, desktop-macos, desktop-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    # Two tags pushed close together publish one at a time, in the order they arrive.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # plugins.updater.pubkey as the newest published release had it: the key installed copies trust.
      - name: Fetch the trusted updater key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-draft.mjs trusted-conf --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/trusted-tauri.conf.json"
      - name: Check the draft and publish it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.desktop-windows.outputs.release_id }}
          STARTED_AT: ${{ needs.desktop-windows.outputs.started_at }}
          APPIMAGE_SHA256: ${{ needs.desktop-linux.outputs.appimage_sha256 }}
          ROTATE_KEY: ${{ inputs.rotate_key }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          rotate=()
          if [ "$ROTATE_KEY" = "true" ]; then
            rotate=(--allow-key-rotation)
          fi
          node scripts/check-release-draft.mjs publish \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" \
            --conf apps/desktop/src-tauri/tauri.conf.json \
            --trusted-conf "$RUNNER_TEMP/trusted-tauri.conf.json" \
            --started-at "$STARTED_AT" \
            --expect-sha256 "Ancilla_${version}_amd64.AppImage=$APPIMAGE_SHA256" \
            "${rotate[@]}"
      # Only a look: a CDN that is slow must never undo a release that passed every check.
      - name: Look at the public latest.json (a warning only)
        continue-on-error: true
        shell: bash
        run: node scripts/check-release-draft.mjs poll --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"

  # Where a rehearsal ends: the checks the publish job would run, without publishing, and then the throwaway draft is
  # deleted, also when a build failed or the run was cancelled.
  dry-run:
    if: ${{ always() && inputs.dry_run }}
    needs: [desktop-windows, desktop-macos, desktop-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Fetch the trusted updater key
        if: needs.desktop-linux.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-draft.mjs trusted-conf --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/trusted-tauri.conf.json"
      - name: Run the publish checks, without publishing
        if: needs.desktop-linux.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.desktop-windows.outputs.release_id }}
          STARTED_AT: ${{ needs.desktop-windows.outputs.started_at }}
          APPIMAGE_SHA256: ${{ needs.desktop-linux.outputs.appimage_sha256 }}
          ROTATE_KEY: ${{ inputs.rotate_key }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          rotate=()
          if [ "$ROTATE_KEY" = "true" ]; then
            rotate=(--allow-key-rotation)
          fi
          node scripts/check-release-draft.mjs check \
            --dry-run \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" \
            --conf apps/desktop/src-tauri/tauri.conf.json \
            --trusted-conf "$RUNNER_TEMP/trusted-tauri.conf.json" \
            --started-at "$STARTED_AT" \
            --expect-sha256 "Ancilla_${version}_amd64.AppImage=$APPIMAGE_SHA256" \
            "${rotate[@]}"
      - name: Delete the rehearsal's draft
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-draft.mjs discard --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
