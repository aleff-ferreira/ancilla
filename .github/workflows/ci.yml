name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an unfinished run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Every file that carries the version agrees, and the changelog has an entry for it
      # (scripts/bump-version.mjs), so a half-done bump never reaches a tag.
      - run: node scripts/bump-version.mjs --check
      - run: npm ci
      # THIRD_PARTY_NOTICES.md follows the lockfiles; a dependency change has to regenerate it
      # (npm run notices). Linux only: Windows runners check the file out with CRLF endings.
      - if: runner.os == 'Linux'
        run: npm run notices:check
      - run: npm run build --workspace @ancilla/daemon --workspace @ancilla/ui --workspace @ancilla/server
      # The test output is kept so a failure can be named below. Bash on every runner: the pipe and its status.
      - shell: bash
        run: |
          set -o pipefail
          npm run test --workspace @ancilla/daemon --workspace @ancilla/ui --workspace @ancilla/server 2>&1 | tee "$RUNNER_TEMP/test.log"
      - run: npm run build --workspace @ancilla/web
      - shell: bash
        run: |
          set -o pipefail
          npm run test --workspace @ancilla/web 2>&1 | tee "$RUNNER_TEMP/web-test.log"
      # One annotation per failing test, with its file, line and error. The run's annotations can be read
      # through the API where the job log cannot, so a failure on a runner one cannot open still says which test.
      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: node scripts/annotate-test-failures.mjs "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/web-test.log"

  # The desktop crate is only otherwise compiled while cutting a release, which is far too late to
  # find out that it does not build.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Tauri links WebKitGTK and friends, which the Ubuntu runner does not ship.
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run build --workspace @ancilla/daemon --workspace @ancilla/ui --workspace @ancilla/server
      - run: npm run build --workspace @ancilla/web
      # tauri-build checks every path in bundle.resources before it compiles anything, and those are
      # built rather than committed. This is what the release does through beforeBuildCommand.
      - run: npm run bundle:server --workspace ancilla-desktop
      # bundle.externalBin is checked the same way, so fetch the Node.js sidecar too.
      - run: npm run fetch:node --workspace ancilla-desktop
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
